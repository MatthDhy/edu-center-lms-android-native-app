server:
  port: 8080

spring:
  application:
    name: celehub-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/celehub_db}
    username: ${DB_USER:celehub_user}
    password: ${DB_PASSWORD:celehub_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # Schema do Flyway quản lý, Hibernate chỉ kiểm tra khớp entity
    properties:
      hibernate.jdbc.time_zone: Asia/Ho_Chi_Minh
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-minimum!!}
    expiration-minutes: 10080   # 7 ngày
  storage:
    type: local                 # sau này đổi: firebase | r2
    local-dir: ./uploads
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  bootstrap:
    admin-email: admin@celehub.edu.vn
    admin-password: ${ADMIN_PASSWORD:Admin@123456}
