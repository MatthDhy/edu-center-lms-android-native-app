services:
  backend:
    build: ./backend
    container_name: celehub_backend
    restart: unless-stopped
    env_file: .env
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
    ports: ["8080:8080"]

  web-admin:
    build: ./web-admin
    container_name: celehub_webadmin
    restart: unless-stopped
    depends_on: [backend]
    ports: ["3000:80"]