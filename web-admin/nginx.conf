server {
    listen 80;
    server_name _;

    # Thư mục chứa React build
    root /usr/share/nginx/html;
    index index.html;

    # ─────────────────────────────────────────────────────────
    # Proxy: mọi request /api/* → Spring Boot backend
    # (backend là tên service trong docker-compose.yml)
    # ─────────────────────────────────────────────────────────
    location ^~ /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Tăng timeout cho upload file
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ─────────────────────────────────────────────────────────
    # Proxy: /files/* → Spring Boot (serve file upload)
    # ─────────────────────────────────────────────────────────
    location ^~ /files/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ─────────────────────────────────────────────────────────
    # SPA fallback: mọi route khác → index.html
    # (để React Router xử lý client-side routing)
    # ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bật gzip compression
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Cache tĩnh cho JS/CSS (hash trong filename nên an toàn)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
