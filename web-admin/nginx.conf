server {
    listen 80;
    server_name _;

    # Cho phép upload ảnh/PDF (mặc định nginx chỉ cho 1MB -> lỗi 413)
    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    # /api/* -> Spring Boot (backend = tên service trong docker-compose)
    location ^~ /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Giữ https thật nếu có nginx/proxy phía ngoài; không có thì dùng scheme hiện tại
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        # Trình duyệt gọi cùng origin qua nginx nên không cần CORS: bỏ Origin để Spring không chặn nhầm (403 Invalid CORS)
        proxy_set_header   Origin            "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ^~ /files/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
